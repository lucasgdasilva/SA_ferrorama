<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainPass | Login</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="ondas">
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="#142537" d="M0,100
       C220,120 440,115 690,95
       C940,75 1190,70 1440,90
       L1440,320
       L0,320
       Z">
            </path>
        </svg>
    </div>

    <header>
        <div class="logo flex">
            <img src="../assets/logo.png" alt="Logo do TrainPass" class="logotipo" width=50px>
            <p class="titulo">TrainPass</p>
        </div>
    </header>
    <main>
        <section class="container-login">
            <h2>Cadastre-se</h2>
            <p>Informe seus dados<br> abaixo</p>

            <form action="" class="formulario-login">
                <input type="text" placeholder="Nome completo" required>
                <input type="email" placeholder="E-mail" required>
                <input type="text" placeholder="Nome de usuário" required>
                <input type="password" placeholder="Senha" required>
                <input type="password" placeholder="Confirmar senha" required>
                <button type="submit">Cadastre-se</button>
            </form>
        </section>

    </main>

</body>

</html>
