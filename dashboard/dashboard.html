<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainPass | Login</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="cabecalho flex">
            <div class="logo flex">
                <img src="../assets/logo.png" alt="Logo do TrainPass" class="logotipo" width="50px">
                <p class="titulo">TrainPass</p>
            </div>
            <div class="notificacoes">
                <img src="../assets/icone-notificacaoes.svg" alt="Notificações" width="32">
            </div>
            <div class="perfil">
                <img src="../assets/icone-perfil.svg" alt="Notificações" width="32">
            </div>
        </div>
    </header>
    <main>
        <div class="conteudo flex">
            <div class="barra-nav">
                <div class="item-barra-nav flex">
                    <img src="../assets/icone-gerenciar.svg" alt="Gerenciar" width="32">
                    <p class="titulo-item">Gerenciar linhas</p>
                </div>
                <div class="item-barra-nav flex">
                    <img src="../assets/icone-gerenciar.svg" alt="Gerenciar" width="32">
                    <p class="titulo-item">Gerenciar trens</p>
                </div>
                <div class="item-barra-nav flex">
                    <img src="../assets/icone-alertas.svg" alt="Alertas" width="32">
                    <p class="titulo-item">Alertas</p>
                </div>
                <div class="item-barra-nav flex">
                    <img src="../assets/icone-sensores.svg" alt="Gerenciar" width="32">
                    <p class="titulo-item">Sensores</p>
                </div>
                <div class="item-barra-nav flex">
                    <img src="../assets/icone-relatorios.svg" alt="Gerenciar" width="32">
                    <p class="titulo-item">Relatórios</p>
                </div>
                <div class="item-barra-nav flex">
                    <img src="../assets/icone-gerenciar-usuarios.svg" alt="Gerenciar" width="32">
                    <p class="titulo-item">Gerenciar usuários</p>
                </div>
                <div class="espaco-config">
                    <img src="../assets/icone-configuracoes.svg" alt="Gerenciar" width="32">
                </div>

            </div>         
            <div class="espaco-conteudo">
                <div class="container-principal">

                </div>
            </div>   
        </div>
    </main>



</body>

</html>
