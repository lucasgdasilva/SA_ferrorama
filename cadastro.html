<html lang="pt-br">

            </div>
            <div class="opcoes">
                <div class="tema">
                    <p>Tema claro</p>
                    <button id="botao-switch">
                        <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="M280-240q-100 0-170-70T40-480q0-100 70-170t170-70h400q100 0 170 70t70 170q0 100-70 170t-170 70H280Zm0-80h400q66 0 113-47t47-113q0-66-47-113t-113-47H280q-66 0-113 47t-47 113q0 66 47 113t113 47Zm85-75q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Zm115-85Z"/></svg>
                        <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#e3e3e3"><path d="M280-240q-100 0-170-70T40-480q0-100 70-170t170-70h400q100 0 170 70t70 170q0 100-70 170t-170 70H280Zm0-80h400q66 0 113-47t47-113q0-66-47-113t-113-47H280q-66 0-113 47t-47 113q0 66 47 113t113 47Zm485-75q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Zm-285-85Z"/></svg>
                    </button>
                </div>
            </div>
        </div>
        
    </header>
    <main>
        <section class="login">
            <div class="container-login">
                <div class="cabecalho-login">
                    <h2>Cadastre-se</h2>
                    <p>Informe seus dados abaixo.</p>
                </div>
                <div class="formulario-login">
                     <input type="text" id="nome" placeholder="Nome completo" required />
                    <input type="email" id="email" placeholder="E-mail" required />
                    <input type="text" id="usuario" placeholder="Nome de usuário" required />
                    <input type="password" id="senha" placeholder="Senha" required />
                    <input type="password" id="senha" placeholder="Confirmar senha" required />
                    <button type="submit" id="botao-entrar">Cadastrar</button>
                </div>
            </div>
            <div class="retornar">
                <a href="login.html">Voltar ao login</a></p>
            </div>
        </section>
    </main>
</body>

</html>
